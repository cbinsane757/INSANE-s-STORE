<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sadwal's Best Store</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f4ff;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #FF0000;
      color: white;
      padding: 10px;
      text-align: center;
      position: relative;
    }

    .search-bar {
      position: absolute;
      top: 20px;
      right: 30px;
    }

    .search-bar input[type="text"] {
      padding: 10px 15px;
      border: none;
      border-radius: 25px 0 0 25px;
      width: 250px;
      font-size: 14px;
      outline: none;
      background-color: white;
    }

    .search-bar button {
      padding: 10px 20px;
      border: none;
      background-color: #003e92;
      color: white;
      border-radius: 0 25px 25px 0;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .search-bar button:hover {
      background-color: #002f6e;
    }

    .product-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .product-card {
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .product-card:hover {
      transform: scale(1.03);
    }

    .product-image img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      margin: 0 0 10px;
      color: #004aad;
    }

    .product-info p {
      margin: 5px 0;
    }

    .price {
      color: green;
      font-weight: Jeff Levine;
    }

    .btn {
      background-color: #004aad;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      margin-top: 10px;
      border-radius: 5px;
      width: 100%;
    }

    .btn:hover {
      background-color: #00347a;
    }
  </style>
</head>
<body>
